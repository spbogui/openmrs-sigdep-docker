# ============================================================================
#  SIGDEP 3.x - déploiement sur site
#  Démarrage : docker compose up -d        (voir README.md)
# ============================================================================
name: sigdep

services:

  # ---------------------------------------------------------------- MySQL
  db:
    image: mysql:5.7
    container_name: sigdep-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER:-1G}
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définir MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: openmrs                 # nom imposé par le dump SIGDEP
      MYSQL_USER: ${OPENMRS_DB_USER:-openmrs_user}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:?Définir OPENMRS_DB_PASSWORD dans .env}
      TZ: ${TZ:-Africa/Abidjan}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro   # importé au 1er démarrage uniquement
    # ports:                                       # décommenter pour un accès externe
    #   - "${MYSQL_EXPOSED_PORT:-3306}:3306"
    healthcheck:
      # TCP (127.0.0.1) : ne répond pas pendant l'import initial -> OpenMRS attend
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30m
    networks: [sigdep]

  # -------------------------------------------------------------- OpenMRS
  openmrs:
    image: spbogui/sigdep:${SIGDEP_VERSION:-3.0.0}
    # build: .                                     # décommenter pour construire localement
    container_name: sigdep-openmrs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: openmrs
      DB_USER: ${OPENMRS_DB_USER:-openmrs_user}
      DB_PASSWORD: ${OPENMRS_DB_PASSWORD}
      JAVA_XMS: ${JAVA_XMS:-2G}
      JAVA_XMX: ${JAVA_XMX:-4G}
      TZ: ${TZ:-Africa/Abidjan}
    volumes:
      # chemin (./openmrs-data) = dossier visible ; nom (openmrs-data) = volume Docker
      - ${OPENMRS_DATA_PATH:-./openmrs-data}:/openmrs/data
    # ports:                                       # accès direct sans nginx
    #   - "8080:8080"
    networks: [sigdep]

  # ---------------------------------------------------------------- Nginx
  nginx:
    image: nginx:alpine
    container_name: sigdep-nginx
    restart: unless-stopped
    depends_on: [openmrs]
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [sigdep]

  # -------------------------------------------------- Sauvegarde quotidienne
  backup:
    image: mysql:5.7                               # réutilise l'image MySQL (mysqldump)
    container_name: sigdep-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # copie normalisée en LF (robuste si le kit a été édité sous Windows)
    entrypoint:
      - /bin/bash
      - -c
      - sed 's/\r$$//' /scripts/backup.sh > /usr/local/bin/sigdep-backup && chmod +x /usr/local/bin/sigdep-backup && exec sigdep-backup
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_HOST: db
      DB_NAME: openmrs
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Africa/Abidjan}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    networks: [sigdep]

volumes:
  db-data:
  openmrs-data:        # utilisé si OPENMRS_DATA_PATH=openmrs-data (recommandé sous Windows)

networks:
  sigdep:
